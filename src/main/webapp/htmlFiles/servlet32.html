<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>011000101</title>
</head>
<body>

<form action="/binaryNumbers" method="post">
  <label>
    Binary number:
    <input
            type="text"
            name="binary"
            pattern="[01]+"
            title="Please enter only binary digits (0 or 1)"
            maxlength="8"
            required>
  </label>
  <br>
  <label>
    <input type="submit" value="Submit">
  </label>
</form>

</body>
</html>
