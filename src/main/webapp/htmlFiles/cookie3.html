<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cookie3</title>
</head>
<body>

<form action="/cookie3" method="POST">
  <label>
    Cookie key:
    <input type="text" name="key">
  </label>
  <label>
    Cookie value:
    <input type="text" name="value">
  </label>
  <label>
    Lifetime of cookie in hours:
    <select name="time">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select>
  </label>
  <input type="submit">
</form>

</body>
</html>
