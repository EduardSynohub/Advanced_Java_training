<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Session4</title>
</head>
<body>

<form action="/session4" method="post">
    <label>
        Name of product:
        <input type="text" name="productName">
    </label>
    <label>
        Enter quantity:
        <input type="number" name="quantity" min="0" step="1">
    </label>
    <label>
        Enter price:
        <input type="number" name="price" min="0.01" step="0.01">
    </label>
    <label>
        <input type="submit" value="Submit">
    </label>
</form>
<br>
<a href="/session4">Show me cart</a>

</body>
</html>
